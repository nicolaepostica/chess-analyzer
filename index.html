<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chess Analyzer</title>
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="%BASE_URL%favicon-16.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <!-- Apply the saved theme before the first paint (see src/hooks/useTheme.ts). -->
    <script>
      try {
        var theme = localStorage.getItem('chess-analyzer:theme')
        document.documentElement.dataset.theme =
          theme === 'lichess' || theme === 'wood' ? theme : 'charcoal'
      } catch (e) {
        document.documentElement.dataset.theme = 'charcoal'
      }
    </script>
    <!-- Adds cross-origin isolation on hosts that cannot set headers (GitHub Pages). -->
    <script src="%BASE_URL%coi-serviceworker.min.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
